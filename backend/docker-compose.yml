services:
  backend:
    build: .
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "8000:8000"

  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5 
      TZ: UTC
    ports:
      - "5432:5432"
