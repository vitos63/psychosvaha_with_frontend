<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <script>
    (function bootstrapTelegramViewport() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;

      var MOBILE_PLATFORMS = ['android', 'android_x', 'ios'];
      var isMobile = MOBILE_PLATFORMS.indexOf((tg.platform || '').toLowerCase()) !== -1;
      var versionAtLeast = function (v) {
        try { return typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v); }
        catch (e) { return false; }
      };

      try { tg.ready(); } catch (e) { }
      try { tg.expand(); } catch (e) { }

      if (versionAtLeast('7.7')) {
        try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) { }
      }

      if (!isMobile && versionAtLeast('8.0') && typeof tg.requestFullscreen === 'function') {
        try { tg.requestFullscreen(); } catch (e) { }
      }
    })();
  </script>

  <title>React App</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
