services:
  backend:
    env_file:
      - ./backend/.env
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      socks5:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8000:8000"
  
  socks5:
    image: serjs/go-socks5-proxy
    ports:
      - "1080:1080"
    environment:
      - PROXY_USER=user
      - PROXY_PASSWORD=pass
  
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5 
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"

volumes:
  postgres_data:
