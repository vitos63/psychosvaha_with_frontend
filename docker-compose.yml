services:
  backend:
    volumes:
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ss-client:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ss-client:
    image: shadowsocks/shadowsocks-libev:latest
    restart: unless-stopped
    command: >
      ss-local
      -s ${SS_SERVER_HOST:?SS_SERVER_HOST is required}
      -p ${SS_SERVER_PORT:-8388}
      -b 0.0.0.0
      -l 1080
      -k ${SS_PASSWORD:?SS_PASSWORD is required}
      -m ${SS_METHOD:-aes-256-gcm}
      -u
  
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://0.0.0.0:8000/api/v1}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5 
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
#    ports:
#      - "5432:5432"

volumes:
  postgres_data:
